<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- JUST A COURT. It used to carry two players and a ball as well, which at the size an
       icon is actually seen — 48px in a tab, 64px on a home screen — was three coloured
       dots on top of the markings rather than three things you could make out. The pitch
       on its own is the shape the game is. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f7a3f"/>
      <stop offset="1" stop-color="#0b3d1f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#g)"/>
  <!-- ⚠️ EVERYTHING FITS THE MASKABLE SAFE ZONE, and the old drawing did not. The manifest
       declares this icon `maskable`, so Android may crop it to a CIRCLE of 80% diameter —
       radius 204.8 about the centre. The old court's corners sat 252 out and the goal ends
       213, so both were cropped off on a round mask. The court's corners are now 194 out
       and the goals' 185, plus 6 for the half stroke: inside it with room. -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.88" stroke-width="12"
     stroke-linejoin="round" stroke-linecap="round">
    <rect x="146" y="96" width="220" height="320" rx="10"/>
    <line x1="146" y1="256" x2="366" y2="256"/>
    <circle cx="256" cy="256" r="52"/>
    <!-- The goals, open onto the pitch the way the game draws them — three sides, so the
         mouth is a gap rather than a second line laid over the goal line. -->
    <path d="M206 96 L206 78 L306 78 L306 96" stroke="#5a7de0"/>
    <path d="M206 416 L206 434 L306 434 L306 416" stroke="#e05a5a"/>
  </g>
  <circle cx="256" cy="256" r="8" fill="#ffffff" fill-opacity="0.88"/>
</svg>
